<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JLPT Japanese Quiz</title>
  
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script src="n5-vocabulary-database.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --correct: #22c55e;
      --incorrect: #ef4444;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: fit-content;
      min-width: 440px;
      max-width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    @media (max-width: 480px) {
      .app {
        width: 100%;
        min-width: 0;
      }
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .mode-toggle {
      display: flex;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-top: 12px;
    }

    .content-toggle {
      margin-top: 8px;
    }

    .appearance-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .accent-picker {
      width: 32px;
      height: 24px;
      padding: 2px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .reset-accent-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .reset-accent-btn:hover,
    .reset-accent-btn:focus-visible {
      color: var(--accent);
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0b0f19;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 600;
      margin: 12px 0 16px 0;
    }

    .card {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 16px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .jp-display {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .jp-display.sentence {
      font-size: 1.75rem;
      letter-spacing: 0;
    }

    .jp-display ruby {
      ruby-position: over;
    }

    .jp-display rt {
      color: var(--accent);
      font-size: 0.42em;
      font-weight: 600;
      line-height: 1;
    }

    .grammar-colour-toggle {
      display: none;
    }

    .grammar-colour-toggle.visible {
      display: flex;
    }

    .jp-display.grammar-colours-active .grammar-part {
      border-radius: 4px;
      padding: 0 2px;
    }

    .jp-display.grammar-colours-active .grammar-part.noun { color: #fbbf24; }
    .jp-display.grammar-colours-active .grammar-part.particle { color: #c084fc; }
    .jp-display.grammar-colours-active .grammar-part.verb { color: #4ade80; }
    .jp-display.grammar-colours-active .grammar-part.adjective { color: #fb923c; }
    .jp-display.grammar-colours-active .grammar-part.auxiliary { color: #60a5fa; }
    .jp-display.grammar-colours-active .grammar-part.punctuation { color: var(--text-dim); }

    .grammar-legend {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 0.72rem;
    }

    .grammar-legend.visible {
      display: flex;
    }

    .grammar-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .grammar-legend-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .grammar-legend-swatch.noun { background: #fbbf24; }
    .grammar-legend-swatch.particle { background: #c084fc; }
    .grammar-legend-swatch.verb { background: #4ade80; }
    .grammar-legend-swatch.adjective { background: #fb923c; }
    .grammar-legend-swatch.auxiliary { background: #60a5fa; }
    .grammar-legend-swatch.punctuation { background: var(--text-dim); }

    .kanji-sub {
      font-size: 1rem;
      color: var(--text-dim);
      margin-top: 4px;
      min-height: 1.2em;
    }

    .hint-display {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 8px;
      min-height: 1.2em;
      visibility: hidden;
      font-weight: 600;
    }

    .hint-display.visible {
      visibility: visible;
    }

    .feedback {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      min-height: 24px;
      margin-bottom: 12px;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.incorrect { color: var(--incorrect); }

    .grammar-analysis {
      display: none;
      width: 100%;
      margin: 20px 0 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      text-align: left;
    }

    .grammar-analysis.visible {
      display: block;
    }

    .grammar-analysis h2 {
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .grammar-analysis-intro {
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-bottom: 8px;
    }

    .grammar-analysis-list {
      display: grid;
      gap: 6px;
    }

    .grammar-analysis-row {
      display: grid;
      grid-template-columns: minmax(70px, 0.8fr) minmax(80px, 1fr) minmax(80px, 1fr) minmax(90px, 1fr) minmax(150px, 2fr);
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-left: 3px solid var(--text-dim);
      border-radius: 8px;
      font-size: 0.78rem;
    }

    .grammar-analysis-row.noun { border-left-color: #fbbf24; }
    .grammar-analysis-row.particle { border-left-color: #c084fc; }
    .grammar-analysis-row.verb { border-left-color: #4ade80; }
    .grammar-analysis-row.adjective { border-left-color: #fb923c; }
    .grammar-analysis-row.auxiliary { border-left-color: #60a5fa; }
    .grammar-analysis-token { color: var(--text); font-size: 1rem; font-weight: 700; }
    .grammar-analysis-reading,
    .grammar-analysis-romaji,
    .grammar-analysis-role { color: var(--text-dim); }
    .grammar-analysis-reading { font-size: 0.75rem; }
    .grammar-analysis-romaji { font-size: 0.75rem; }
    .grammar-analysis-role { font-weight: 700; }
    .grammar-analysis-explanation { color: var(--text); }

    @media (max-width: 560px) {
      .grammar-analysis-row {
        grid-template-columns: minmax(55px, 0.8fr) minmax(70px, 1fr) minmax(70px, 1fr) minmax(80px, 1fr);
      }

      .grammar-analysis-explanation {
        grid-column: 1 / -1;
        color: var(--text-dim);
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .opt-btn {
      background: #0b0f19;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 8px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .opt-btn.correct {
      background: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #fff;
    }

    .opt-btn.incorrect {
      background: var(--incorrect) !important;
      border-color: var(--incorrect) !important;
      color: #fff;
    }

    .input-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .text-input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 0 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }

    .action-btn {
      width: 100%;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .status-badge {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 12px;
    }

    .history {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .history h2 {
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-item {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-left: 3px solid var(--text-dim);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.78rem;
    }

    .history-item.correct { border-left-color: var(--correct); }
    .history-item.incorrect { border-left-color: var(--incorrect); }
    .history-item.skipped { border-left-color: var(--text-dim); }

    .history-prompt {
      color: var(--text);
      font-weight: 700;
    }

    .history-detail {
      color: var(--text-dim);
      margin-top: 3px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <h1>JLPT N5 Japanese Quiz</h1>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-quiz-mode" onclick="setMode('choice')">Multiple Choice</button>
        <button class="mode-btn" id="btn-type-mode" onclick="setMode('type')">Keyboard Input</button>
      </div>
      <div class="mode-toggle content-toggle">
        <button class="mode-btn active" id="btn-word-content" onclick="setContent('word')">Words</button>
        <button class="mode-btn" id="btn-sentence-content" onclick="setContent('sentence')">Sentences</button>
      </div>
      <div class="mode-toggle content-toggle">
        <button class="mode-btn active" id="btn-hiragana-script" onclick="setScript('hiragana')">Hiragana</button>
        <button class="mode-btn" id="btn-katakana-script" onclick="setScript('katakana')">Katakana</button>
        <button class="mode-btn" id="btn-all-script" onclick="setScript('all')">All</button>
      </div>
      <div class="mode-toggle content-toggle" id="answer-type-toggle">
        <button class="mode-btn active" id="btn-reading-answer" onclick="setSentenceAnswerMode('reading')">Reading</button>
        <button class="mode-btn" id="btn-translation-answer" onclick="setSentenceAnswerMode('translation')">Translation</button>
      </div>
      <div class="mode-toggle content-toggle grammar-colour-toggle" id="grammar-colour-toggle">
        <button class="mode-btn active" id="btn-grammar-off" onclick="setGrammarColourMode('off')">Plain</button>
        <button class="mode-btn" id="btn-grammar-before" onclick="setGrammarColourMode('before')">Colours before answer</button>
        <button class="mode-btn" id="btn-grammar-after" onclick="setGrammarColourMode('after')">Colours after answer</button>
      </div>
      <div class="grammar-legend" id="grammar-legend" aria-label="Grammar colour legend">
        <span class="grammar-legend-item"><span class="grammar-legend-swatch noun"></span>Noun</span>
        <span class="grammar-legend-item"><span class="grammar-legend-swatch particle"></span>Particle</span>
        <span class="grammar-legend-item"><span class="grammar-legend-swatch verb"></span>Verb</span>
        <span class="grammar-legend-item"><span class="grammar-legend-swatch adjective"></span>Adjective</span>
        <span class="grammar-legend-item"><span class="grammar-legend-swatch auxiliary"></span>Auxiliary</span>
        <span class="grammar-legend-item"><span class="grammar-legend-swatch punctuation"></span>Punctuation</span>
      </div>
      <div class="appearance-controls">
        <label for="accent-picker">Accent</label>
        <input class="accent-picker" id="accent-picker" type="color" value="#38bdf8" title="Choose accent colour" aria-label="Choose accent colour">
        <button class="reset-accent-btn" id="reset-accent-btn" type="button">Reset</button>
      </div>
    </header>

    <div class="stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>Streak: <strong id="streak">0</strong> 🔥</span>
      <span>Questions: <strong id="question-count">0</strong></span>
    </div>

    <div class="card">
      <div class="jp-display" id="jp">Loading...</div>
      <div class="kanji-sub" id="kanji-sub"></div>
      <div class="hint-display" id="hint">--</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="grid" id="options"></div>

    <div class="input-container" id="type-container" style="display: none;">
      <input type="text" class="text-input" id="answer-input" placeholder="Type romaji or hiragana..." autocomplete="off" autocorrect="off" autocapitalize="none">
      <button class="submit-btn" id="submit-input-btn" onclick="submitTypedAnswer()">Check</button>
    </div>

    <button class="action-btn" id="next-btn" onclick="loadNextQuestion()">Next Question →</button>

    <section class="grammar-analysis" id="grammar-analysis" aria-labelledby="grammar-analysis-title">
      <h2 id="grammar-analysis-title">Grammar analysis</h2>
      <p class="grammar-analysis-intro">The sentence is split into morphology-backed grammar units.</p>
      <div class="grammar-analysis-list" id="grammar-analysis-list"></div>
    </section>

    <div class="status-badge" id="data-status">Loading local N5 vocabulary...</div>

    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">History</h2>
      <div class="history-list" id="history-list" aria-live="polite"></div>
    </section>
  </div>

  <script>
    let vocabularyList = [];
    let currentQuestion = null;
    const temporarySettings = new Map();
    const quizStorage = {
      get(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return temporarySettings.get(key) || null;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          temporarySettings.set(key, value);
        }
      }
    };
    const savedMode = quizStorage.get('japanese-quiz-mode');
    const savedContent = quizStorage.get('japanese-quiz-content');
    const savedScript = quizStorage.get('japanese-quiz-script');
    const savedAnswerMode = quizStorage.get('japanese-quiz-answer-mode');
    const savedGrammarColourMode = quizStorage.get('japanese-quiz-grammar-colours');
    let currentMode = ['choice', 'type'].includes(savedMode) ? savedMode : 'choice';
    let currentContent = ['word', 'sentence'].includes(savedContent) ? savedContent : 'word';
    let currentScript = ['hiragana', 'katakana', 'all'].includes(savedScript) ? savedScript : 'hiragana';
    let sentenceAnswerMode = ['reading', 'translation'].includes(savedAnswerMode) ? savedAnswerMode : 'reading';
    let grammarColourMode = ['off', 'before', 'after'].includes(savedGrammarColourMode) ? savedGrammarColourMode : 'off';
    let score = 0;
    let streak = 0;
    let questionCount = 0;
    let previousKana = '';
    let answerHistory = [];
    let grammarTokenizer = null;

    const defaultAccent = '#38bdf8';

    function initializeGrammarTokenizer() {
      if (!window.kuromoji) return Promise.resolve(null);
      return new Promise(resolve => {
        kuromoji.builder({ dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/' }).build((error, tokenizer) => {
          if (!error) grammarTokenizer = tokenizer;
          resolve(grammarTokenizer);
        });
      });
    }

    function applyAccentColor(color, save = true) {
      const hex = color.toLowerCase();
      const red = parseInt(hex.slice(1, 3), 16);
      const green = parseInt(hex.slice(3, 5), 16);
      const blue = parseInt(hex.slice(5, 7), 16);

      document.documentElement.style.setProperty('--accent', hex);
      document.documentElement.style.setProperty('--accent-glow', `rgba(${red}, ${green}, ${blue}, 0.25)`);
      document.getElementById('accent-picker').value = hex;
      if (save) quizStorage.set('japanese-quiz-accent', hex);
    }

    function initializeAccentColor() {
      const savedAccent = quizStorage.get('japanese-quiz-accent');
      const accent = /^#[0-9a-f]{6}$/i.test(savedAccent || '') ? savedAccent : defaultAccent;
      applyAccentColor(accent, false);
      document.getElementById('accent-picker').addEventListener('input', event => {
        applyAccentColor(event.target.value);
      });
      document.getElementById('reset-accent-btn').addEventListener('click', () => {
        applyAccentColor(defaultAccent);
      });
    }

    async function loadVocabularyDatabase() {
      const statusElem = document.getElementById('data-status');
      const jpDisplay = document.getElementById('jp');

      try {
        let data = window.N5_VOCABULARY;
        if (!Array.isArray(data)) {
          const response = await fetch('n5-vocabulary-database.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          data = await response.json();
        }
        if (!Array.isArray(data) || data.length < 4) {
          throw new Error('The local N5 database is empty or invalid');
        }

        vocabularyList = data.map(item => ({
          ...item,
          romaji: wanakana.toRomaji(item.kana)
        }));
        const sentenceCount = vocabularyList.filter(item => item.kind === 'sentence').length;
        const wordCount = vocabularyList.length - sentenceCount;
        statusElem.textContent = `Ready! ${wordCount} words and ${sentenceCount} sentences loaded.`;
        loadNextQuestion();
      } catch (error) {
        statusElem.textContent = `Error loading local vocabulary: ${error.message}`;
        jpDisplay.textContent = 'Load Error';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      quizStorage.set('japanese-quiz-mode', mode);
      document.getElementById('btn-quiz-mode').classList.toggle('active', mode === 'choice');
      document.getElementById('btn-type-mode').classList.toggle('active', mode === 'type');
      loadNextQuestion(true);
    }

    function setContent(content) {
      currentContent = content;
      quizStorage.set('japanese-quiz-content', content);
      document.getElementById('btn-word-content').classList.toggle('active', content === 'word');
      document.getElementById('btn-sentence-content').classList.toggle('active', content === 'sentence');
      updateGrammarColourVisibility();
      previousKana = '';
      loadNextQuestion();
    }

    function updateGrammarColourVisibility() {
      const isSentenceMode = currentContent === 'sentence';
      document.getElementById('grammar-colour-toggle').classList.toggle('visible', isSentenceMode);
      document.getElementById('grammar-legend').classList.toggle('visible', isSentenceMode);
    }

    function initializeQuizSettings() {
      document.getElementById('btn-quiz-mode').classList.toggle('active', currentMode === 'choice');
      document.getElementById('btn-type-mode').classList.toggle('active', currentMode === 'type');
      document.getElementById('btn-word-content').classList.toggle('active', currentContent === 'word');
      document.getElementById('btn-sentence-content').classList.toggle('active', currentContent === 'sentence');
      document.getElementById('btn-hiragana-script').classList.toggle('active', currentScript === 'hiragana');
      document.getElementById('btn-katakana-script').classList.toggle('active', currentScript === 'katakana');
      document.getElementById('btn-all-script').classList.toggle('active', currentScript === 'all');
      document.getElementById('btn-reading-answer').classList.toggle('active', sentenceAnswerMode === 'reading');
      document.getElementById('btn-translation-answer').classList.toggle('active', sentenceAnswerMode === 'translation');
    }

    function setSentenceAnswerMode(mode) {
      sentenceAnswerMode = mode;
      quizStorage.set('japanese-quiz-answer-mode', mode);
      document.getElementById('btn-reading-answer').classList.toggle('active', mode === 'reading');
      document.getElementById('btn-translation-answer').classList.toggle('active', mode === 'translation');
      loadNextQuestion(true);
    }

    function setGrammarColourMode(mode) {
      grammarColourMode = mode;
      quizStorage.set('japanese-quiz-grammar-colours', mode);
      ['off', 'before', 'after'].forEach(option => {
        document.getElementById(`btn-grammar-${option}`).classList.toggle('active', option === mode);
      });
      loadNextQuestion(true);
    }

    function setScript(script) {
      currentScript = script;
      quizStorage.set('japanese-quiz-script', script);
      document.getElementById('btn-hiragana-script').classList.toggle('active', script === 'hiragana');
      document.getElementById('btn-katakana-script').classList.toggle('active', script === 'katakana');
      document.getElementById('btn-all-script').classList.toggle('active', script === 'all');
      previousKana = '';
      loadNextQuestion();
    }

    function getSentenceReading(item) {
      if (!Array.isArray(item.furigana)) return wanakana.toHiragana(item.kana);
      const surfaceText = item.kanji || item.kana;
      const hasParticleInKanjiSentence = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(surfaceText)
        && surfaceText.includes('は');
      return item.furigana.map(segment => {
        const reading = segment.reading || segment.text;
        const text = segment.text || '';
        if (text.endsWith('は') && reading.endsWith('は')) {
          return `${reading.slice(0, -1)}わ`;
        }
        if (hasParticleInKanjiSentence && reading.includes('は')) {
          const particleIndex = reading.lastIndexOf('は');
          return `${reading.slice(0, particleIndex)}わ${reading.slice(particleIndex + 1)}`;
        }
        return reading;
      }).join('');
    }

    function formatRomaji(text) {
      return text
        .replace(/[,，、.!?。！？]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function hasKanji(item) {
      const displayText = Array.isArray(item.furigana)
        ? item.furigana.map(segment => segment.text).join('')
        : item.kana;
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(displayText);
    }

    function getExpectedDisplayAnswer(item) {
      if (sentenceAnswerMode === 'translation') return item.meaning;
      return item.kind === 'sentence'
        ? formatRomaji(wanakana.toRomaji(getSentenceReading(item)))
        : item.romaji;
    }

    function classifyGrammarPart(text, reading, role) {
      if (role) return role;
      if (/^[、。！？,.!?]$/.test(text)) return 'punctuation';
      if (/^(は|が|を|に|へ|で|と|の|も|や|から|まで|より|ね|よ|か|だけ|しか|ほど|くらい|ので|のに)$/.test(text)) return 'particle';
      if (/^(する|します|した|しました|しない|しません|して|しよう)$/.test(reading)) return 'verb';
      if (/^(だ|です)$/.test(reading)) return 'verb';
      if (/^(ます|ました|ません|でした|ない|たい|ている|ています|てください)$/.test(reading)) return 'auxiliary';
      if (/(くない|かった|くて)$/.test(reading)) return 'adjective';
      if (/(ます|ました|ません|て|で|た|ない|る|う|く|ぐ|す|つ|ぬ|ぶ|む)$/.test(reading)) return 'verb';
      return 'noun';
    }

    function isKnownGrammarWord(text) {
      return text === 'わたし'
        || text === 'にほんご'
        || vocabularyList.some(item => item.kind !== 'sentence' && item.kana === text);
    }

    function findKnownGrammarPrefix(text) {
      const particles = new Set(['は', 'が', 'を', 'に', 'へ', 'で', 'と', 'の', 'も', 'や', 'から', 'まで', 'より', 'ね', 'よ', 'か']);
      const grammarTokens = new Set(['だ', 'です', 'する', 'します', 'した', 'しました', 'しない', 'しません', 'して', 'しよう', 'ます', 'ました', 'ません', 'でした', 'ない', 'たい', 'ている', 'ています', 'てください']);
      const candidates = vocabularyList
        .filter(item => item.kind !== 'sentence' && text.startsWith(item.kana))
        .map(item => item.kana)
        .filter(value => !particles.has(value) && !grammarTokens.has(value))
        .filter((value, index, values) => values.indexOf(value) === index);
      if (text.startsWith('わたし')) candidates.push('わたし');
      if (text.startsWith('にほんご')) candidates.push('にほんご');
      return candidates.sort((first, second) => second.length - first.length)[0] || '';
    }

    function splitGrammarSegment(segment) {
      const text = segment.text || '';
      const reading = segment.reading || text;
      const punctuationMatch = text.match(/([、。！？,.!?])$/);
      if (punctuationMatch && text.length > 1) {
        const punctuation = punctuationMatch[1];
        const coreText = text.slice(0, -punctuation.length);
        const coreReading = reading.slice(0, -punctuation.length);
        const coreParts = splitGrammarSegment({ text: coreText, reading: coreReading });
        if ((punctuation === '？' || punctuation === '?') && coreText.endsWith('か')) return coreParts;
        return [...coreParts, { text: punctuation, reading: punctuation }];
      }
      if (text === reading) {
        const knownPrefix = findKnownGrammarPrefix(text);
        if (knownPrefix && knownPrefix.length < text.length) {
          return [
            { text: knownPrefix, reading: knownPrefix, role: 'noun' },
            ...splitGrammarSegment({ text: text.slice(knownPrefix.length), reading: reading.slice(knownPrefix.length) })
          ];
        }
        const copulaQuestionMatch = text.match(/^(です|でした|だ)か$/);
        if (copulaQuestionMatch) {
          return [
            { text: copulaQuestionMatch[1], reading: copulaQuestionMatch[1] },
            { text: 'か', reading: 'か' }
          ];
        }
        const suruVerbMatch = text.match(/^(.+)(しました|しません|します|しない|しよう|して|した|する)$/);
        if (suruVerbMatch) {
          return [
            ...splitGrammarSegment({ text: suruVerbMatch[1], reading: suruVerbMatch[1], role: 'noun' }),
            { text: suruVerbMatch[2], reading: suruVerbMatch[2] }
          ];
        }
        const auxiliaryMatch = text.match(/^(.+)(でした|ました|ません|です|ます|だ)$/);
        if (auxiliaryMatch) {
          return [
            ...splitGrammarSegment({ text: auxiliaryMatch[1], reading: auxiliaryMatch[1] }),
            { text: auxiliaryMatch[2], reading: auxiliaryMatch[2] }
          ];
        }
        const internalParticleMatch = text.match(/^(.+?)(は|が|を|に|へ|で|と|の|も|や)(.+)$/);
        const hasKnownBoundary = internalParticleMatch
          && vocabularyList.some(item => item.kind !== 'sentence' && item.kana === internalParticleMatch[1])
          && vocabularyList.some(item => item.kind !== 'sentence' && item.kana === internalParticleMatch[3]);
        if (hasKnownBoundary) {
          return [
            ...splitGrammarSegment({ text: internalParticleMatch[1], reading: internalParticleMatch[1] }),
            { text: internalParticleMatch[2], reading: internalParticleMatch[2] },
            ...splitGrammarSegment({ text: internalParticleMatch[3], reading: internalParticleMatch[3] })
          ];
        }
      }
      const particles = 'は|が|を|に|へ|で|と|の|も|や|から|まで|より|ね|よ|か';
      const parts = [];
      let remainingText = text;
      let remainingReading = reading;
      const leadingParticle = text !== reading
        ? remainingText.match(new RegExp(`^(${particles})(.+)$`))
        : (!isKnownGrammarWord(remainingText)
          ? remainingText.match(new RegExp(`^(${particles})(.+)$`))
          : null);
      if (leadingParticle) {
        parts.push({ text: leadingParticle[1], reading: remainingReading.slice(0, leadingParticle[1].length) });
        remainingText = leadingParticle[2];
        remainingReading = remainingReading.slice(leadingParticle[1].length);
      }
      const trailingParticle = remainingText.match(new RegExp(`^(.+)(${particles})$`));
      if (trailingParticle) {
        const particleReading = remainingReading.slice(-trailingParticle[2].length);
        parts.push({ text: trailingParticle[1], reading: remainingReading.slice(0, -particleReading.length) });
        parts.push({ text: trailingParticle[2], reading: particleReading });
        return parts;
      }
      parts.push({ text: remainingText, reading: remainingReading, role: segment.role });
      return parts;
    }

    function shouldShowGrammarColours() {
      return grammarColourMode === 'before'
        || (grammarColourMode === 'after' && document.getElementById('next-btn').style.display === 'block');
    }

    function renderGrammarSegment(segment) {
      const ruby = document.createElement('ruby');
      const part = document.createElement('span');
      part.className = `grammar-part ${classifyGrammarPart(segment.text, segment.reading || segment.text, segment.role)}`;
      part.append(document.createTextNode(segment.text));
      ruby.append(part);
      if (segment.reading && segment.reading !== segment.text) {
        const reading = document.createElement('rt');
        reading.textContent = segment.reading;
        ruby.append(reading);
      }
      return ruby;
    }

    function classifyMorphologyToken(token) {
      if (token.pos === '助詞') return 'particle';
      if (token.pos === '動詞') return 'verb';
      if (token.pos === '形容詞') return 'adjective';
      if (token.pos === '助動詞') {
        return /^(ます|です|だ)$/.test(token.basic_form) ? 'verb' : 'auxiliary';
      }
      if (/^[、。！？,.!?]$/.test(token.surface_form)) return 'punctuation';
      return 'noun';
    }

    function getGrammarRoleLabel(token) {
      if (token.pos === '助詞') return 'Particle';
      if (token.pos === '動詞') return 'Verb';
      if (token.pos === '形容詞') return 'Adjective';
      if (token.pos === '助動詞' && /^(ます|です|だ)$/.test(token.basic_form)) return 'Verb ending';
      if (token.pos === '助動詞') return 'Auxiliary';
      if (token.pos === '記号') return 'Punctuation';
      return 'Noun';
    }

    const grammarTokenGlosses = {
      'は': 'topic marker; as for',
      'が': 'subject or focus marker',
      'を': 'direct-object marker',
      'で': 'place or means marker; by, at, or with',
      'へ': 'direction marker; to, toward',
      'に': 'destination, time, target, or location marker',
      'の': 'possessive or descriptive linker; of',
      'と': 'companion or quotation marker; with, and',
      'も': 'also, too marker',
      'から': 'starting point marker; from',
      'まで': 'limit marker; until, up to',
      'か': 'question marker',
      'ます': 'polite verb ending',
      'です': 'copula; is, am, are',
      'だ': 'plain copula; is, am, are',
      'ない': 'not; negative auxiliary',
      'する': 'to do',
      '日本語': 'Japanese language',
      'にほんご': 'Japanese language',
      '毎日': 'every day',
      'まいにち': 'every day',
      '勉強': 'study',
      'べんきょう': 'study',
      '難しい': 'difficult',
      'むずかしい': 'difficult'
    };

    function getTokenMeaning(token) {
      const reading = token.reading ? wanakana.toHiragana(token.reading) : '';
      const grammaticalGloss = grammarTokenGlosses[token.basic_form]
        || grammarTokenGlosses[token.surface_form]
        || grammarTokenGlosses[reading];
      if (grammaticalGloss && (token.pos === '助詞' || token.pos === '助動詞' || token.pos === '記号')) {
        return grammaticalGloss;
      }
      const wordItems = vocabularyList.filter(item => item.kind !== 'sentence');
      const exactBasicMatch = wordItems.find(item => item.kanji && item.kanji === token.basic_form);
      if (exactBasicMatch) return exactBasicMatch.meaning;
      const exactKanaMatch = wordItems.find(item => item.kana === reading);
      const match = exactKanaMatch || wordItems.find(item => item.kanji && item.kanji === token.surface_form);
      return match ? match.meaning : (grammaticalGloss || '');
    }

    function getGrammarRelationship(token, tokens, index) {
      const nextToken = tokens[index + 1];
      const previousToken = tokens[index - 1];
      const nextParticle = nextToken && nextToken.pos === '助詞' ? nextToken.surface_form : '';
      const particleRelationships = {
        'は': 'sets this section as the sentence topic',
        'が': 'marks this section as the subject or focus',
        'を': 'marks this section as the direct object of the action',
        'で': 'marks this section as the place or means of the action',
        'へ': 'marks this section as the destination of movement',
        'に': 'marks this section as a destination, time, target, or location',
        'の': 'links this section to the following noun as a description or possession',
        'と': 'links this section as a companion or quotation',
        'も': 'adds the meaning “also” or “too” to this section'
      };

      if (token.pos === '助詞') {
        const relation = particleRelationships[token.surface_form];
        return relation ? `It ${relation}.` : 'It connects this section to the rest of the sentence; its exact function depends on context.';
      }
      if (nextParticle && particleRelationships[nextParticle]) {
        return `The following ${nextParticle} particle ${particleRelationships[nextParticle].replace('this section', 'it')}.`;
      }
      if (token.pos === '動詞') {
        if (nextToken && nextToken.pos === '助動詞' && nextToken.basic_form === 'ます') return 'It supplies the main action; the following ending makes it polite.';
        return 'It supplies an action or state in the sentence.';
      }
      if (token.pos === '助動詞' && token.basic_form === 'ます' && previousToken) return 'It attaches to the preceding verb to make that action polite.';
      if (token.pos === '助動詞' && /^(です|だ)$/.test(token.basic_form)) return 'It links the preceding description or noun to the sentence predicate.';
      if (token.pos === '形容詞') return 'It describes the subject or topic of the sentence.';
      return 'It contributes the content described by the surrounding grammar.';
    }

    function getGrammarExplanation(token, tokens, index) {
      const meaning = getTokenMeaning(token);
      const fallbackMeaning = token.pos === '記号'
        ? 'punctuation; it marks a pause or the end of the sentence'
        : token.pos === '助詞'
          ? 'grammatical particle; its exact nuance depends on context'
          : token.pos === '助動詞'
            ? 'grammatical auxiliary; it adds tense, politeness, or sentence-predicate information'
            : 'content word; use the sentence translation to understand its meaning here';
      const meaningText = `Meaning: ${meaning || fallbackMeaning}. `;
      const dictionaryText = token.basic_form && token.basic_form !== '*'
        ? `Dictionary form: ${token.basic_form}. `
        : '';
      const conjugationText = token.conjugated_form && token.conjugated_form !== '*'
        ? `Conjugation: ${token.conjugated_form}. `
        : '';
      if (token.pos === '記号') return meaningText.trim();
      if (token.pos === '助詞') return `${meaningText}${dictionaryText}${getGrammarRelationship(token, tokens, index)}`;
      if (token.pos === '助動詞' && token.basic_form === 'ます') return `${meaningText}${dictionaryText}${conjugationText}It attaches to the preceding verb to make that action polite.`;
      if (token.pos === '助動詞' && /^(です|だ)$/.test(token.basic_form)) return `${meaningText}${dictionaryText}${conjugationText}It links the preceding description or noun to the sentence predicate.`;
      return `${meaningText}${dictionaryText}${conjugationText}${getGrammarRelationship(token, tokens, index)}`.trim();
    }

    function renderGrammarAnalysis(item) {
      const analysis = document.getElementById('grammar-analysis');
      const list = document.getElementById('grammar-analysis-list');
      list.replaceChildren();
      if (!grammarTokenizer || item.kind !== 'sentence') {
        analysis.classList.remove('visible');
        return;
      }

      const tokens = grammarTokenizer.tokenize(item.kanji || item.kana);
      tokens.forEach((token, index) => {
        if (/^[？?]$/.test(token.surface_form) && index > 0 && tokens[index - 1].surface_form === 'か') return;
        const role = classifyMorphologyToken(token);
        const row = document.createElement('div');
        row.className = `grammar-analysis-row ${role}`;

        const tokenText = document.createElement('strong');
        tokenText.className = 'grammar-analysis-token';
        tokenText.textContent = token.surface_form;

        const reading = document.createElement('span');
        reading.className = 'grammar-analysis-reading';
        reading.textContent = token.reading ? wanakana.toHiragana(token.reading) : '—';

        const romaji = document.createElement('span');
        romaji.className = 'grammar-analysis-romaji';
        romaji.textContent = token.reading ? wanakana.toRomaji(token.reading) : '—';

        const roleLabel = document.createElement('span');
        roleLabel.className = 'grammar-analysis-role';
        roleLabel.textContent = getGrammarRoleLabel(token);

        const explanation = document.createElement('span');
        explanation.className = 'grammar-analysis-explanation';
        explanation.textContent = getGrammarExplanation(token, tokens, index);

        row.append(tokenText, reading, romaji, roleLabel, explanation);
        list.appendChild(row);
      });
      analysis.classList.add('visible');
    }

    function renderMorphologicalSentence(item, display) {
      const tokens = grammarTokenizer.tokenize(item.kanji || item.kana);
      const sourceReading = item.kana || '';
      const normalizedSourceReading = wanakana.toHiragana(sourceReading);
      let sourceCursor = 0;
      tokens.forEach((token, index) => {
        const isRedundantQuestionMark = /^[？?]$/.test(token.surface_form)
          && index > 0
          && tokens[index - 1].surface_form === 'か';
        if (isRedundantQuestionMark) return;
        const tokenReading = token.reading && token.reading !== '*'
          ? token.reading
          : token.surface_form;
        const normalizedTokenReading = wanakana.toHiragana(tokenReading);
        const sourceIndex = currentScript === 'all' && normalizedTokenReading
          ? normalizedSourceReading.indexOf(normalizedTokenReading, sourceCursor)
          : -1;
        let reading = tokenReading;
        if (sourceIndex >= 0) {
          reading = sourceReading.slice(sourceIndex, sourceIndex + normalizedTokenReading.length);
          sourceCursor = sourceIndex + normalizedTokenReading.length;
        } else if (currentScript === 'hiragana') {
          reading = wanakana.toHiragana(tokenReading);
        } else if (currentScript === 'katakana') {
          reading = wanakana.toKatakana(tokenReading);
        }
        display.append(renderGrammarSegment({
          text: reading,
          reading,
          role: classifyMorphologyToken(token)
        }));
      });
    }

    function getExpectedValidationAnswer(item) {
      const displayAnswer = getExpectedDisplayAnswer(item);
      return sentenceAnswerMode === 'reading'
        ? readingKey(displayAnswer)
        : displayAnswer.toLowerCase();
    }

    function normalizeAnswer(answer) {
      return answer.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function editSimilarity(first, second) {
      const previous = Array.from({ length: second.length + 1 }, (_, index) => index);
      for (let firstIndex = 1; firstIndex <= first.length; firstIndex += 1) {
        const current = [firstIndex];
        for (let secondIndex = 1; secondIndex <= second.length; secondIndex += 1) {
          const changeCost = first[firstIndex - 1] === second[secondIndex - 1] ? 0 : 1;
          current[secondIndex] = Math.min(
            current[secondIndex - 1] + 1,
            previous[secondIndex] + 1,
            previous[secondIndex - 1] + changeCost
          );
        }
        previous.splice(0, previous.length, ...current);
      }
      const longestLength = Math.max(first.length, second.length);
      return longestLength ? 1 - previous[second.length] / longestLength : 1;
    }

    function readingKey(answer) {
      return answer.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function prefixSimilarity(first, second) {
      const firstKey = readingKey(first);
      const secondKey = readingKey(second);
      let prefixLength = 0;
      while (prefixLength < firstKey.length
        && prefixLength < secondKey.length
        && firstKey[prefixLength] === secondKey[prefixLength]) {
        prefixLength += 1;
      }
      return prefixLength / Math.max(firstKey.length, secondKey.length, 1);
    }

    function answerSimilarity(correctAnswer, candidateAnswer, prioritizePrefix = false) {
      const correct = normalizeAnswer(correctAnswer);
      const candidate = normalizeAnswer(candidateAnswer);
      const correctWords = new Set(correct.split(' ').filter(Boolean));
      const candidateWords = new Set(candidate.split(' ').filter(Boolean));
      const sharedWords = [...correctWords].filter(word => candidateWords.has(word)).length;
      const totalWords = new Set([...correctWords, ...candidateWords]).size;
      const wordSimilarity = totalWords ? sharedWords / totalWords : 0;
      const lengthSimilarity = 1 - Math.min(1, Math.abs(correct.length - candidate.length) / Math.max(correct.length, candidate.length, 1));
      const prefixScore = prefixSimilarity(correctAnswer, candidateAnswer);

      if (prioritizePrefix) {
        return editSimilarity(correct, candidate) * 0.35
          + lengthSimilarity * 0.2
          + wordSimilarity * 0.1
          + prefixScore * 0.35;
      }

      return editSimilarity(correct, candidate) * 0.55
        + lengthSimilarity * 0.25
        + wordSimilarity * 0.2;
    }

    function getSimilarWrongChoices(expectedAnswer) {
      const prioritizePrefix = sentenceAnswerMode === 'reading';
      const candidates = vocabularyList
        .filter(item => item.kind === currentQuestion.kind)
        .map(item => getExpectedDisplayAnswer(item))
        .filter(answer => answer !== expectedAnswer)
        .filter((answer, index, answers) => answers.indexOf(answer) === index)
        .map(answer => ({
          answer,
          similarity: answerSimilarity(expectedAnswer, answer, prioritizePrefix)
        }))
        .sort((first, second) => second.similarity - first.similarity);

      const expectedStart = readingKey(expectedAnswer)[0];
      const sameStartCandidates = prioritizePrefix
        ? candidates.filter(candidate => readingKey(candidate.answer)[0] === expectedStart)
        : candidates;
      const strongestCandidates = (sameStartCandidates.length >= 3 ? sameStartCandidates : candidates).slice(0, 3);
      return strongestCandidates
        .sort(() => Math.random() - 0.5)
        .slice(0, 3)
        .map(candidate => candidate.answer);
    }

    function loadNextQuestion(keepCurrent = false) {
      if (!vocabularyList.length) return;

      const contentQuestions = vocabularyList.filter(item => currentContent === 'sentence'
        ? item.kind === 'sentence'
        : item.kind !== 'sentence');
      const scriptQuestions = contentQuestions.filter(item => {
        const hasKatakana = /[\u30A0-\u30FF]/.test(item.kana);
        return currentScript === 'all'
          || (currentScript === 'katakana' && hasKatakana)
          || (currentScript === 'hiragana' && !hasKatakana);
      });
      if (!scriptQuestions.length) return;

      const shouldKeepCurrent = keepCurrent && currentQuestion && scriptQuestions.includes(currentQuestion);
      if (!shouldKeepCurrent) {
        const availableQuestions = scriptQuestions.length > 1
          ? scriptQuestions.filter(item => item.kana !== previousKana)
          : scriptQuestions;
        currentQuestion = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
        previousKana = currentQuestion.kana;
        questionCount += 1;
        document.getElementById('question-count').textContent = questionCount;
      }

      const jpDisplay = document.getElementById('jp');
      jpDisplay.classList.toggle('sentence', currentQuestion.kind === 'sentence');
      jpDisplay.replaceChildren();
      if (currentQuestion.kind === 'sentence' && Array.isArray(currentQuestion.furigana)) {
        if (grammarTokenizer) {
          renderMorphologicalSentence(currentQuestion, jpDisplay);
        } else {
          currentQuestion.furigana.forEach(segment => {
            splitGrammarSegment(segment).forEach(part => {
              jpDisplay.append(renderGrammarSegment(part));
            });
          });
        }
      } else {
        jpDisplay.textContent = currentQuestion.kana;
      }
      jpDisplay.classList.toggle('grammar-colours-active', currentQuestion.kind === 'sentence' && shouldShowGrammarColours());
      document.getElementById('kanji-sub').textContent = currentQuestion.kanji ? currentQuestion.kanji : '';
      
      const hintElem = document.getElementById('hint');
      hintElem.textContent = `Meaning: ${currentQuestion.meaning}`;
      hintElem.classList.remove('visible');

      const expectedAnswer = getExpectedDisplayAnswer(currentQuestion);
      const input = document.getElementById('answer-input');
      input.placeholder = sentenceAnswerMode === 'translation'
        ? 'Type the English meaning...'
        : 'Type romaji or hiragana...';
      
      const fb = document.getElementById('feedback');
      fb.textContent = "";
      fb.className = "feedback";
      document.getElementById('grammar-analysis').classList.remove('visible');
      document.getElementById('grammar-analysis-list').replaceChildren();
      
      document.getElementById('next-btn').style.display = "none";

      const grid = document.getElementById('options');
      const inputContainer = document.getElementById('type-container');

      if (currentMode === 'choice') {
        grid.style.display = 'grid';
        inputContainer.style.display = 'none';

        const wrongChoices = getSimilarWrongChoices(expectedAnswer);

        const options = [expectedAnswer, ...wrongChoices].sort(() => Math.random() - 0.5);

        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = opt;
          btn.onclick = () => validateAnswer(opt, btn);
          grid.appendChild(btn);
        });
      } else {
        grid.style.display = 'none';
        inputContainer.style.display = 'flex';
        input.value = '';
        input.disabled = false;
        document.getElementById('submit-input-btn').disabled = false;
        input.focus();
      }
    }

    function submitTypedAnswer() {
      const input = document.getElementById('answer-input');
      const val = input.value.trim().toLowerCase();

      const answer = sentenceAnswerMode === 'translation'
        ? val
        : wanakana.toRomaji(val);
      validateAnswer(answer, null);
    }

    function validateAnswer(selected, button) {
      const fb = document.getElementById('feedback');
      document.getElementById('hint').classList.add('visible');
      const expectedAnswer = getExpectedValidationAnswer(currentQuestion);
      const submittedAnswer = String(selected || '');
      const isSkipped = !submittedAnswer.trim();
      const normalizedSelected = sentenceAnswerMode === 'translation'
        ? submittedAnswer.toLowerCase()
        : readingKey(submittedAnswer);
      const expectedDisplayAnswer = getExpectedDisplayAnswer(currentQuestion);
      const isCorrect = normalizedSelected === expectedAnswer;

      answerHistory.unshift({
        prompt: currentQuestion.kana,
        answer: normalizedSelected,
        correctAnswer: expectedDisplayAnswer,
        meaning: currentQuestion.meaning,
        isCorrect,
        isSkipped
      });
      renderHistory();

      if (currentMode === 'choice') {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      } else {
        document.getElementById('answer-input').disabled = true;
        document.getElementById('submit-input-btn').disabled = true;
      }

      if (isSkipped) {
        fb.textContent = `Skipped. Correct: ${expectedDisplayAnswer}`;
        fb.classList.add('incorrect');
        streak = 0;
      } else if (isCorrect) {
        if (button) button.classList.add('correct');
        fb.textContent = "Correct! (正解)";
        fb.classList.add('correct');
        score += 10;
        streak += 1;
      } else {
        if (button) button.classList.add('incorrect');
        fb.textContent = `Incorrect! Correct: ${expectedDisplayAnswer}`;
        fb.classList.add('incorrect');
        streak = 0;

        if (currentMode === 'choice') {
          document.querySelectorAll('.opt-btn').forEach(b => {
            if (b.textContent === expectedDisplayAnswer) b.classList.add('correct');
          });
        }
      }

      document.getElementById('score').textContent = score;
      document.getElementById('streak').textContent = streak;
      document.getElementById('next-btn').style.display = "block";
      renderGrammarAnalysis(currentQuestion);
      if (currentQuestion.kind === 'sentence' && grammarColourMode === 'after') {
        document.getElementById('jp').classList.add('grammar-colours-active');
      }
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';

      answerHistory.forEach(item => {
        const entry = document.createElement('div');
        const resultClass = item.isSkipped ? 'skipped' : (item.isCorrect ? 'correct' : 'incorrect');
        entry.className = `history-item ${resultClass}`;

        const prompt = document.createElement('div');
        prompt.className = 'history-prompt';
        const resultLabel = item.isSkipped ? 'Skipped' : (item.isCorrect ? 'Correct' : 'Incorrect');
        prompt.textContent = `${resultLabel}: ${item.prompt}`;

        const detail = document.createElement('div');
        detail.className = 'history-detail';
        detail.textContent = item.isCorrect
          ? `${item.answer} · ${item.meaning}`
          : `${item.isSkipped ? 'Correct' : `You: ${item.answer} · Correct`}: ${item.correctAnswer} · ${item.meaning}`;

        entry.append(prompt, detail);
        historyList.appendChild(entry);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (document.getElementById('next-btn').style.display === 'block') {
          loadNextQuestion();
        } else if (currentMode === 'type') {
          submitTypedAnswer();
        }
      }
    });

    initializeAccentColor();
    initializeQuizSettings();
    updateGrammarColourVisibility();
    setGrammarColourMode(grammarColourMode === 'before' || grammarColourMode === 'after' ? grammarColourMode : 'off');
    initializeGrammarTokenizer().then(() => {
      if (currentQuestion && currentQuestion.kind === 'sentence') loadNextQuestion(true);
    });
    loadVocabularyDatabase();
  </script>
</body>
</html>
